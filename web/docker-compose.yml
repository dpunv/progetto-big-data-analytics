services:
  visualizer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nosql-visualizer:latest
    container_name: nosql-visualizer
    ports:
      - "8088:8080"
    volumes:
      - ./frontend:/app/frontend:ro
    environment:
      - PORT=8080
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
