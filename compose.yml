services:
  qdrant-1:
    image: qdrant/qdrant:latest
    container_name: qdrant-1
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__STORAGE__STRICT_MODE=false
    volumes:
      - ./qdrant_storage_1:/qdrant/storage
    restart: unless-stopped
  qdrant-2:
