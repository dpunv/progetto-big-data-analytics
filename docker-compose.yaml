# docker-compose.yaml
# 
# SCOPO GENERALE:
# - Definisce l'infrastruttura multi-nodo Qdrant per il sistema di sharding distribuito
# - Crea 3 nodi Qdrant indipendenti che il nostro codice Python orchestra manualmente
# - Ogni nodo è un'istanza isolata di Qdrant con le proprie porte e storage
#
# PERCHÉ DOCKER COMPOSE:
# - Permette di simulare un cluster distribuito in locale
# - Facile da avviare/fermare con un comando (docker-compose up/down)
# - Ogni servizio è isolato ma può comunicare tra loro
# - In produzione, questi sarebbero server fisici separati

# ── Defaults per tutti i servizi Qdrant (restart, healthcheck, ulimits, logging)
x-qdrant-defaults: &qdrant_defaults
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:6333/collections || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  ulimits:
    nofile: 65536
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  # NODO 1: Primo nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 0, 3, 6, 9 (round-robin iniziale)
  qdrant-node-1:
    image: qdrant/qdrant:latest  # Immagine ufficiale Qdrant
    container_name: qdrant-node-1
    ports:
      - "6333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "6334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      # Mappa cartella locale → container per persistenza dati
      # I dati sopravvivono al riavvio del container
      - ./qdrant_data/node-1:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 2: Secondo nodo Qdrant del cluster
  # MODIFICATO: Usa porta 7444 invece di 7333 (problematica)
  qdrant-node-2:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-2
    ports:
      - "7444:6333"  # CAMBIATO da 7333 a 7444
      - "7445:6334"  # CAMBIATO da 7334 a 7445
    volumes:
      - ./qdrant_data/node-2:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    <<: *qdrant_defaults

  # NODO 3: Terzo nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 2, 5, 8 (round-robin iniziale)
  # NOTA: Il cluster 5 diventerà l'hotspot e verrà splittato
  qdrant-node-3:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-3
    ports:
      - "8333:6333"  # Porte 8333/8334 per evitare conflitti
      - "8334:6334"
    volumes:
      - ./qdrant_data/node-3:/qdrant/storage  # Storage separato per node-3
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    <<: *qdrant_defaults

  # NODO 4: Quarto nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 3, 6, 9 (round-robin iniziale)
  qdrant-node-4:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-4
    ports:
      - "9333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "9334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-4:/qdrant/storage  # Storage separato per node-4
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 5: Quinto nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 4, 7, 0 (round-robin iniziale)
  qdrant-node-5:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-5
    ports:
      - "10333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "10334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-5:/qdrant/storage  # Storage separato per node-5
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 6: Sesto nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 5, 8, 1 (round-robin iniziale)
  qdrant-node-6:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-6
    ports:
      - "11333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "11334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-6:/qdrant/storage  # Storage separato per node-6
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 7: Settimo nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 6, 9, 2 (round-robin iniziale)
  qdrant-node-7:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-7
    ports:
      - "12333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "12334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-7:/qdrant/storage  # Storage separato per node-7
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 8: Ottavo nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 7, 0, 3 (round-robin iniziale)
  qdrant-node-8:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-8
    ports:
      - "13333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "13334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-8:/qdrant/storage  # Storage separato per node-8
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 9: Nono nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 8, 1, 4 (round-robin iniziale)
  qdrant-node-9:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-9
    ports:
      - "14333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "14334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-9:/qdrant/storage  # Storage separato per node-9
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

  # NODO 10: Decimo nodo Qdrant del cluster
  # RUOLO: Riceverà cluster 9, 2, 5 (round-robin iniziale)
  qdrant-node-10:
    image: qdrant/qdrant:latest
    container_name: qdrant-node-10
    ports:
      - "15333:6333"  # API REST - interfaccia principale per query/inserimenti
      - "15334:6334"  # gRPC - protocollo più veloce per operazioni bulk
    volumes:
      - ./qdrant_data/node-10:/qdrant/storage  # Storage separato per node-10
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Configura porta gRPC interna
    <<: *qdrant_defaults

# COME SI USA:
# 1. Avvia i nodi: docker-compose up -d
# 2. Verifica: docker ps (dovresti vedere 3 container)
# 3. Accedi a Qdrant dashboard: http://localhost:6333/dashboard (node-1)
# 4. Esegui il codice Python: python main.py
# 5. Ferma i nodi: docker-compose down
#
# ARCHITETTURA RISULTANTE:
# - 3 nodi Qdrant indipendenti (no clustering nativo Qdrant)
# - Il nostro codice Python fa da "orchestratore"
# - Routing manuale tramite RoutingTable
# - Migrazione dati manuale tramite Rebalancer