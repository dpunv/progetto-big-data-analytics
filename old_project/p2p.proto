syntax = "proto3";

package p2p;

service P2PNode {
    rpc ReceiveVectors (AddVectorsRequest) returns (Empty);
    rpc QueryPeer (QueryRequest) returns (QueryResponse);
    rpc RegisterPeers (RegisterPeersRequest) returns (Empty);
    rpc SetClusters (SetClustersRequest) returns (Empty);
}

message Empty {}

message VectorPoint {
    repeated float vector = 1;
    int64 id = 2;
    string payload = 3;
    string cluster = 4;
}

message AddVectorsRequest {
    int64 req_id = 1;
    repeated VectorPoint content = 2;
    string type = 3; // "bootstrap", "clustering", etc.
}

message QueryRequest {
    int64 req_id = 1;
    repeated VectorList query_vectors = 2;
    int32 topk = 3;
}

message VectorList {
    repeated float values = 1;
    string cluster_id = 2;
}

message ScoredPoint {
    int64 id = 1;
    float score = 2;
    VectorPoint payload = 3;
}

message QueryResponse {
    repeated ScoredPoint results = 1;
}

message PeerInfo {
    string id = 1;
    string http_url = 2;
    string grpc_url = 3; // New field for gRPC connectivity
}

message RegisterPeersRequest {
    repeated PeerInfo peers = 1;
}

// For complex clustering structures, we serialize the dict/object to JSON/bytes
// to avoid over-engineering the proto file for internal python logic.
message SetClustersRequest {
    int64 req_id = 1;
    bytes content_pickle = 2;
}
