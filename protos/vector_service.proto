syntax = "proto3";

package vector_service;

// ============================================================================
// SERVICE DEFINITION - Internal P2P Communication
// ============================================================================

service VectorService {
  // Bulk vector insertion (server-side streaming for backpressure)
  rpc AddVectorsBulk(stream VectorData) returns (BulkInsertResponse);
  
  // Peer-to-peer search
  rpc SearchPeer(SearchRequest) returns (SearchResponse);
  
  // Gossip protocol (bidirectional streaming)
  rpc GossipClusters(stream ClusterUpdate) returns (stream ClusterUpdate);
  
  // Health check (gRPC built-in, but we define custom for compatibility)
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Single vector send (for compatibility, prefer bulk)
  rpc SendVector(VectorData) returns (VectorResponse);
}

// ============================================================================
// MESSAGES - Data Types
// ============================================================================

message VectorData {
  string id = 1;
  repeated float vector = 2;
  map<string, string> payload = 3;
  string from_node = 4;
}

message BulkInsertResponse {
  int32 vectors_stored = 1;
  string node_id = 2;
  map<string, int32> batches = 3;  // node_id -> count (for forwarding tracking)
}

message VectorResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
}

message SearchRequest {
  string from_node = 1;
  repeated float query_vector = 2;
  int32 top_k = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
  string node_id = 2;
}

message SearchResult {
  string id = 1;
  double score = 2;
  repeated float vector = 3;
  map<string, string> payload = 4;
}

message ClusterUpdate {
  string from_node = 1;
  repeated ClusterVector cluster_vectors = 2;
}

message ClusterVector {
  repeated float centroid = 1;
  int32 cluster_id = 2;
}

message HealthCheckRequest {
  string node_id = 1;
}

message HealthCheckResponse {
  string status = 1;  // "UP", "DOWN", "DEGRADED"
  string node_id = 2;
  int64 timestamp = 3;
}
